name: chen-abot
service:
  name: chen-abot
  type: worker
  env:
    - key: DISCORD_BOT_TOKEN
      value: "你的Bot_Token填在这里"
  routes:
    - port: 8000
      path: /
  scaling:
    min: 1
    max: 1
  instance_type: free
  regions:
    - was
  build:
    builder: buildpack
    build_command: pip install -r requirements.txt
  run:
    command: python main.py